# Applies DB migrations to PRODUCTION. Requires manual approval via the "production" environment.
name: Migrate production
on:
  workflow_dispatch:
    inputs:
      project: { description: "core or nl", required: true }
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production        # configure Required reviewers = Saurabh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: |
          cd supabase/${{ github.event.inputs.project }}
          supabase link --project-ref "${{ github.event.inputs.project == 'nl' && secrets.SUPABASE_NL_REF || secrets.SUPABASE_CORE_REF }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ github.event.inputs.project == 'nl' && secrets.SUPABASE_NL_DB_PASSWORD || secrets.SUPABASE_CORE_DB_PASSWORD }}
